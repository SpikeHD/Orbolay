name: build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'Cargo.toml'
      - 'src/**/*'
      - 'flatpak/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'Cargo.toml'
      - 'src/**/*'
      - 'flatpak/**'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.config.platform }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - platform: ubuntu-22.04
            target: 'x86_64-unknown-linux-gnu'

          - platform: macos-latest
            target: 'x86_64-apple-darwin'

          - platform: macos-latest
            target: 'aarch64-apple-darwin'

          - platform: windows-latest
            target: 'x86_64-pc-windows-msvc'
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.config.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Dependencies
        if: matrix.config.platform == 'ubuntu-22.04'
        run: sudo apt-get install -y build-essential libssl-dev pkg-config cmake libgtk-3-dev libclang-dev libglib2.0-dev libx11-dev

      - name: Add targets
        run: rustup target add ${{ matrix.config.target }}

      - name: Define GIT_HASH
        id: sha
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build
        run: cargo build --release --target ${{ matrix.config.target }}
        env:
          GIT_HASH: ${{ steps.sha.outputs.GIT_HASH }}
          RUSTFLAGS: -Awarnings

      - name: Upload binary
        if: matrix.config.platform != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: orbolay-${{ matrix.config.target }}
          path: target/${{ matrix.config.target }}/release/orbolay

      - name: Upload binary (Windows)
        if: matrix.config.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: orbolay-${{ matrix.config.target }}
          path: target/${{ matrix.config.target }}/release/orbolay.exe

  bundle:
    needs: build
    runs-on: ${{ matrix.config.platform }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - platform: ubuntu-22.04
            target: 'x86_64-unknown-linux-gnu'
            bundles: ['appimage', 'deb']

          - platform: macos-latest
            target: 'x86_64-apple-darwin'
            bundles: ['osx']

          - platform: macos-latest
            target: 'aarch64-apple-darwin'
            bundles: ['osx']
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.config.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Add targets
        run: rustup target add ${{ matrix.config.target }}

      - name: Add bundler
        run: cargo install cargo-bundle --locked

      - name: Download binary
        uses: actions/download-artifact@v7
        with:
          name: orbolay-${{ matrix.config.target }}
          path: target/${{ matrix.config.target }}/release/

      - name: Bundle
        run: cargo bundle --release --target ${{ matrix.config.target }}
        env:
          CARGO_BUNDLE_SKIP_BUILD: 1
          GIT_HASH: ${{ steps.sha.outputs.GIT_HASH }}
          RUSTFLAGS: -Awarnings

      - name: (macOS) Zip app
        if: matrix.config.platform == 'macos-latest'
        run: |
            cd target/${{ matrix.config.target }}/release/bundle/osx/
            zip -r Orbolay-${{ matrix.config.target }}.app.zip Orbolay.app

      - name: Upload AppImage
        if: matrix.config.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: orbolay-${{ matrix.config.target }}.AppImage
          path: target/${{ matrix.config.target }}/release/bundle/appimage/orbolay*.AppImage

      - name: Upload deb
        if: matrix.config.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: orbolay-${{ matrix.config.target }}.deb
          path: target/${{ matrix.config.target }}/release/bundle/deb/orbolay*.deb

      - name: Upload macOS app
        if: matrix.config.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: orbolay-${{ matrix.config.target }}.app
          path: target/${{ matrix.config.target }}/release/bundle/osx/Orbolay-${{ matrix.config.target }}.app.zip

  generate-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download cargo source generator
        run: |
          curl -fsSL https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/74697c75b630d7330e77250fc13cb5ea688d9479/cargo/flatpak-cargo-generator.py -o /tmp/flatpak-cargo-generator.py

      - name: Generate cargo sources
        run: |
          uv run --script /tmp/flatpak-cargo-generator.py Cargo.lock -o flatpak/cargo-sources.json

      - name: Disable git submodules in generated sources
        run: |
          python3 - <<'PY'
          import json
          path = 'flatpak/cargo-sources.json'
          with open(path) as f:
              sources = json.load(f)
          for source in sources:
              if isinstance(source, dict) and source.get('type') == 'git':
                  source['disable-submodules'] = True
          with open(path, 'w') as f:
              json.dump(sources, f, indent=2)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: cargo-sources
          path: flatpak/cargo-sources.json
          if-no-files-found: error

  flatpak:
    needs: generate-sources
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: cargo-sources
          path: flatpak/

      - name: Set GIT_HASH
        run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dev.spikehd.orbolay.flatpak
          manifest-path: flatpak/dev.spikehd.orbolay.yml
          cache: true
          cache-key: flatpak-builder-${{ hashFiles('flatpak/**', 'Cargo.toml', 'Cargo.lock') }}
          upload-artifact: true
          artifact-name: orbolay-x86_64-unknown-linux-gnu.flatpak
